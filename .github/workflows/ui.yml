name: CI - UI Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/BitsAndBobs/clientapp/**'
      - '.github/workflows/ui.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/BitsAndBobs/clientapp/**'
      - '.github/workflows/ui.yml'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/BitsAndBobs/clientapp'
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'
        cache-dependency-path: src/BitsAndBobs/clientapp/pnpm-lock.yaml
    - name: Install Node.js dependencies
      run: pnpm install --frozen-lockfile
    - name: Run eslint
      run: pnpm run lint
    - name: Build
      run: pnpm run build
    - name: Run tests
      run: pnpm run test
